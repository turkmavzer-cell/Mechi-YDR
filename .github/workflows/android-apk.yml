name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21   # Capacitor 8 -> JDK 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install persistent debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} 2>&1 | tee gradle.log || {
            # Hata özetini Actions ekranında görünür annotation olarak yaz
            { grep -E "^e: |error:|ERROR:" gradle.log | head -4
              sed -n '/What went wrong/,/\* Try:/p' gradle.log | grep -v -E "^\s*$|\* Try:" | head -5
            } | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Verify APK signature (must match keystore/debug.keystore)
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-256 digest: 5832f90eb65881c6519c7691e0ba0d50c514fe60aed72ecb4007a5d9c782300e" certs.txt \
            || { echo "::error::APK beklenen anahtarla imzalanmadi; telefonda guncelleme olarak kurulamaz"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: MeChi-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
